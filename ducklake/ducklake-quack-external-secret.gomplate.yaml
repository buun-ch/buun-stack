apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ducklake-quack-external-secret
  namespace: {{ .Env.DUCKLAKE_NAMESPACE }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: ducklake-quack
    creationPolicy: Owner
  data:
    - secretKey: QUACK_TOKEN
      remoteRef:
        key: ducklake/quack
        property: token
    - secretKey: CATALOG_HOST
      remoteRef:
        key: ducklake/catalog
        property: host
    - secretKey: CATALOG_PORT
      remoteRef:
        key: ducklake/catalog
        property: port
    - secretKey: CATALOG_DB
      remoteRef:
        key: ducklake/catalog
        property: database
    - secretKey: CATALOG_USER
      remoteRef:
        key: ducklake/catalog
        property: username
    - secretKey: CATALOG_PASSWORD
      remoteRef:
        key: ducklake/catalog
        property: password
    - secretKey: S3_ENDPOINT
      remoteRef:
        key: ducklake/storage
        property: endpoint
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: ducklake/storage
        property: access_key
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: ducklake/storage
        property: secret_key
    - secretKey: DATA_PATH
      remoteRef:
        key: ducklake/storage
        property: data_path
