langfuse:
  image:
    tag: "{{ .Env.LANGFUSE_IMAGE_TAG }}"

  # Pod Security Context (restricted PSS compliant)
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault

  # Container Security Context (restricted PSS compliant)
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false

  salt:
    value: {{ .Env.LANGFUSE_SALT }}
  encryptionKey:
    secretKeyRef:
      name: encryption-key
      key: key
  features:
    telemetryEnabled: false
    # Allow SSO users to automatically create accounts on first login
    # Username/password authentication is disabled via AUTH_DISABLE_USERNAME_PASSWORD
    signUpDisabled: false
    experimentalFeaturesEnabled: false
  nextauth:
    url: https://{{ .Env.LANGFUSE_HOST }}
    secret:
      value: {{ .Env.NEXTAUTH_SECRET }}
  additionalEnv:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: postgres-auth
          key: url
    # https://langfuse.com/self-hosting/authentication-and-sso#keycloak
    - name: AUTH_DISABLE_USERNAME_PASSWORD
      value: "true"
    - name: AUTH_KEYCLOAK_ALLOW_ACCOUNT_LINKING
      value: "true"
    - name: AUTH_KEYCLOAK_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: keycloak-auth
          key: client_id
    - name: AUTH_KEYCLOAK_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: keycloak-auth
          key: client_secret
    - name: AUTH_KEYCLOAK_ISSUER
      value: "https://{{ .Env.KEYCLOAK_HOST }}/realms/{{ .Env.KEYCLOAK_REALM }}"
    # Data retention enforcement. Only the UI toggle that sets
    # projects.retention_days is EE-gated; the worker jobs acting on it are OSS,
    # so the retention window is written directly by `just langfuse::set-retention`.
    #
    # The daily sweep is the complete one: it deletes ClickHouse rows, expired
    # media, and the raw ingestion-event blobs from object storage together with
    # their blob_storage_file_log references. Enabled by default upstream, set
    # explicitly here because it is the only job that covers the event blobs.
    - name: QUEUE_CONSUMER_DATA_RETENTION_QUEUE_IS_ENABLED
      value: "true"
    # Hourly incremental ClickHouse cleanup, so expired rows do not sit around
    # until 03:15. Also starts MediaRetentionCleaner, whose blob-storage pass only
    # runs for projects that have expired media, hence the daily sweep above.
    - name: LANGFUSE_BATCH_DATA_RETENTION_CLEANER_ENABLED
      value: "true"
    # ClickHouse deletes above are lightweight deletes (mask only). This cleaner
    # applies the masks so the disk space is actually reclaimed.
    - name: LANGFUSE_CLICKHOUSE_DELETED_MASK_CLEANER_ENABLED
      value: "true"

  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: traefik
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    className: traefik
    hosts:
      - host: {{ .Env.LANGFUSE_HOST }}
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      enabled: true

  # Resource recommendations from Goldilocks VPA
  # web target: cpu=15m, memory=717Mi
  # The memory limit also caps the V8 old-space heap (~50% of the limit).
  # A 1.5Gi limit crashed init with "JavaScript heap out of memory" at ~780MB.
  web:
    resources:
      requests:
        cpu: 25m
        memory: 1Gi
      limits:
        cpu: 500m
        memory: 3Gi
    # Probe configuration adjusted for slow startup and response time
    livenessProbe:
      initialDelaySeconds: 180
      timeoutSeconds: 30
      failureThreshold: 5
    readinessProbe:
      initialDelaySeconds: 60
      timeoutSeconds: 30
      failureThreshold: 5

  # Resource recommendations from Goldilocks VPA
  # worker target: cpu=15m, memory=380Mi
  worker:
    resources:
      requests:
        cpu: 25m
        memory: 512Mi
      limits:
        cpu: 100m
        memory: 1Gi
    # Probe configuration adjusted for slow startup
    # Init (model/dashboard upserts) takes ~110s, so 60s was too tight.
    livenessProbe:
      initialDelaySeconds: 180
      timeoutSeconds: 30
      failureThreshold: 5

postgresql:
  deploy: false

redis:
  deploy: true
  architecture: standalone
  auth:
    username: "default"
    existingSecret: redis-auth
    existingSecretPasswordKey: secret
  # The subchart is Valkey aliased as `redis`, so the key is `primary`, not
  # `master` — under `master` the block is silently ignored and the "nano"
  # resourcesPreset (150m CPU / 192Mi) applies, which starves BullMQ during
  # startup and surfaces as "Socket timeout" on every queue in the worker.
  # Memory limit must accommodate dataset + AOF rewrite fork (copy-on-write).
  # Observed RDB ~172MB → limit 256Mi caused OOMKill during AOF auto-rewrite.
  primary:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 768Mi

clickhouse:
  deploy: false
  host: clickhouse-clickhouse.clickhouse
  database: langfuse
  clusterEnabled: false
  auth:
    username: langfuse
    existingSecret: clickhouse-auth
    existingSecretKey: password

  # for internal ClickHouse
  # # https://github.com/bitnami/charts/tree/main/bitnami/clickhouse
  # deploy: true
  # auth:
  #   existingSecret: clickhouse-auth
  #   existingSecretKey: password
  # shards: 1
  # replicaCount: 1
  # zookeeper:
  #   enabled: true
  #   replicaCount: 1
  #   # persistence:
  #   #   storageClass: local-path

s3:
  deploy: false
  bucket: {{ .Env.LANGFUSE_BUCKET }}
  region: "auto"
  endpoint: {{ .Env.LANGFUSE_S3_ENDPOINT }}
  forcePathStyle: true
  accessKeyId:
    secretKeyRef:
      name: s3-auth
      key: access_key
  secretAccessKey:
    secretKeyRef:
      name: s3-auth
      key: secret_key
  # Separate prefixes so the three payload types stay distinguishable in the
  # bucket. Raw ingestion events are the ones that grow with trace volume:
  # events/<projectId>/<entityType>/<entityId>/<eventId>.json
  eventUpload:
    prefix: events/
  mediaUpload:
    prefix: media/
  batchExport:
    prefix: exports/
