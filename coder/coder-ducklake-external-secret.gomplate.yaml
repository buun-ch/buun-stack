apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ducklake-credentials
  namespace: {{ .Env.CODER_WORKSPACE_NAMESPACE }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: ducklake-credentials
    creationPolicy: Owner
  data:
    - secretKey: DUCKLAKE_CATALOG_HOST
      remoteRef:
        key: ducklake/catalog
        property: host
    - secretKey: DUCKLAKE_CATALOG_PORT
      remoteRef:
        key: ducklake/catalog
        property: port
    - secretKey: DUCKLAKE_CATALOG_DB
      remoteRef:
        key: ducklake/catalog
        property: database
    - secretKey: DUCKLAKE_CATALOG_USER
      remoteRef:
        key: ducklake/catalog
        property: username
    - secretKey: DUCKLAKE_CATALOG_PASSWORD
      remoteRef:
        key: ducklake/catalog
        property: password
    - secretKey: DUCKLAKE_S3_ENDPOINT
      remoteRef:
        key: ducklake/storage
        property: endpoint
    - secretKey: DUCKLAKE_S3_ACCESS_KEY
      remoteRef:
        key: ducklake/storage
        property: access_key
    - secretKey: DUCKLAKE_S3_SECRET_KEY
      remoteRef:
        key: ducklake/storage
        property: secret_key
    - secretKey: DUCKLAKE_DATA_PATH
      remoteRef:
        key: ducklake/storage
        property: data_path
