apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-db-url
  namespace: {{ .Env.CODER_NAMESPACE }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: coder-db-url
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: coder/database
        property: url
