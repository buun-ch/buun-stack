catalog:
  image:
    repository: quay.io/lakekeeper/catalog
    tag: v0.12.2
    pullPolicy: IfNotPresent

  replicas: 1

  # Lakekeeper configuration (mounted as environment variables)
  # https://docs.lakekeeper.io/docs/latest/configuration/
  # OIDC/authz/secret-backend settings are configured via the dedicated
  # auth/authz/secretBackend values below, so this map is left empty.
  config: {}

  # Service configuration
  service:
    type: ClusterIP

  # Resource limits (based on Goldilocks/VPA recommendations, rounded to clean values)
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 256Mi

  # Security context for Pod Security Standards (restricted)
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL

  # Database migration configuration
  dbMigrations:
    enabled: true

  # Ingress configuration
  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: traefik
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    ingressClassName: traefik
    host: {{ .Env.LAKEKEEPER_HOST }}
    path: ""
    tls:
      enabled: true
      secretName: lakekeeper-tls

# Authentication configuration (OIDC via Keycloak)
auth:
  oauth2:
    providerUri: "https://{{ .Env.KEYCLOAK_HOST }}/realms/{{ .Env.KEYCLOAK_REALM }}"
    audience: "lakekeeper"
    ui:
      clientID: "lakekeeper"
      scopes: "openid profile lakekeeper"

# Authorization backend
authz:
  backend: "allowall"

# Secret backend for storing storage credentials.
# The encryption key Secret is generated and kept by the chart across upgrades
# (helm.sh/resource-policy: keep), so no key needs to be supplied here.
secretBackend:
  type: "Postgres"

# PostgreSQL subchart (disabled since we use external)
postgresql:
  enabled: false

# External database configuration
externalDatabase:
  type: postgres
  host_read: postgres-cluster-rw.postgres
  host_write: postgres-cluster-rw.postgres
  port: 5432
  database: lakekeeper
  user: lakekeeper
  userSecret: lakekeeper-database-secret
  userSecretKey: username
  passwordSecret: lakekeeper-database-secret
  passwordSecretKey: password
